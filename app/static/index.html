<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cassava Leaf Disease Classifier</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f7f9f8;
      color: #222;
      max-width: 820px;
      margin: 32px auto;
      padding: 0 16px;
      line-height: 1.5;
    }
    h1 { margin-bottom: 4px; }
    .meta { color: #555; margin-top: 0; margin-bottom: 24px; }
    section {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 18px 20px;
      margin-bottom: 20px;
    }
    h2 { margin-top: 0; font-size: 1.15rem; }
    input, select {
      margin-top: 8px;
      margin-bottom: 10px;
      padding: 6px 8px;
      display: block;
    }
    .btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
    button {
      padding: 8px 14px;
      border: none;
      border-radius: 6px;
      background: #2e7d32;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { background: #256428; }
    button.secondary { background: #d97706; }
    button.secondary:hover { background: #b45309; }
    .result-box {
      margin-top: 14px;
      padding: 14px;
      border-radius: 6px;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
    }
    .result-box.error {
      background: #fef2f2;
      border-color: #fecaca;
      color: #991b1b;
    }
    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: bold;
    }
    .badge-healthy { background: #dcfce7; color: #166534; }
    .badge-diseased { background: #fef3c7; color: #92400e; }
    .kv-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
      margin-top: 10px;
    }
    .kv-item {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 0.9rem;
    }
    .kv-label { color: #666; font-size: 0.8rem; display: block; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.92rem; }
    th, td { border: 1px solid #e5e7eb; padding: 8px 10px; text-align: left; }
    th { background: #f3f4f6; }
  </style>
</head>
<body>
  <h1>Cassava Leaf Disease Classifier</h1>
  <p class="meta">Active model version: <strong id="versionVal">Loading...</strong></p>

  <section>
    <h2>1. Predict Single Leaf</h2>
    <input type="file" id="predictFile" accept="image/*" />
    <button onclick="runPrediction()">Predict</button>
    <div class="result-box" id="predictResult">No prediction yet.</div>
  </section>

  <section>
    <h2>2. Bulk Upload &amp; Retrain</h2>
    <select id="retrainLabel">
      <option value="Mosaic_Diseased">Mosaic_Diseased</option>
      <option value="Healthy">Healthy</option>
    </select>
    <input type="file" id="retrainFiles" accept="image/*" multiple />
    <div class="btn-row">
      <button onclick="uploadRetrainData()">Upload Images</button>
      <button class="secondary" onclick="triggerRetrain()">Retrain Model</button>
    </div>
    <div class="result-box" id="retrainResult">No retraining run yet.</div>
  </section>

  <section>
    <h2>3. Dataset Feature Summary</h2>
    <div id="vizContainer">Loading...</div>
  </section>

  <script>
    async function loadVersion() {
      const res = await fetch('/version');
      const data = await res.json();
      document.getElementById('versionVal').textContent = data.model_version;
    }

    async function loadVisualizations() {
      const res = await fetch('/visualizations');
      const data = await res.json();
      let html = '<table><tr><th>Feature</th><th>Healthy Mean</th><th>Mosaic_Diseased Mean</th><th>Notes</th></tr>';

      data.interpretations.forEach(item => {
        const stats = data.features[item.feature];
        html += `<tr>
          <td><strong>${item.title}</strong></td>
          <td>${stats.Healthy_mean}</td>
          <td>${stats.Mosaic_Diseased_mean}</td>
          <td>${item.story}</td>
        </tr>`;
      });

      html += '</table>';
      document.getElementById('vizContainer').innerHTML = html;
    }

    async function runPrediction() {
      const fileInput = document.getElementById('predictFile');
      const box = document.getElementById('predictResult');
      box.className = 'result-box';

      if (!fileInput.files.length) {
        box.textContent = 'Select an image first.';
        return;
      }

      const form = new FormData();
      form.append('file', fileInput.files[0]);
      box.textContent = 'Running prediction...';

      const res = await fetch('/predict', { method: 'POST', body: form });
      const data = await res.json();

      if (!res.ok) {
        box.className = 'result-box error';
        box.textContent = data.detail || 'Prediction failed.';
        return;
      }

      const isHealthy = data.predicted_class === 'Healthy';
      const badgeClass = isHealthy ? 'badge-healthy' : 'badge-diseased';
      const confidencePct = (data.confidence * 100).toFixed(1) + '%';
      const f = data.interpretable_features;

      box.innerHTML = `
        <div>Prediction: <span class="badge ${badgeClass}">${data.predicted_class}</span></div>
        <div class="kv-grid">
          <div class="kv-item"><span class="kv-label">Confidence</span><strong>${confidencePct}</strong></div>
          <div class="kv-item"><span class="kv-label">Model Version</span><strong>${data.model_version}</strong></div>
          <div class="kv-item"><span class="kv-label">Yellow Patch Ratio</span><strong>${f.chlorosis_yellow_ratio}</strong></div>
          <div class="kv-item"><span class="kv-label">Excess Green Index</span><strong>${f.excess_green_index}</strong></div>
          <div class="kv-item"><span class="kv-label">Texture Energy</span><strong>${f.laplacian_texture_energy}</strong></div>
        </div>
      `;
    }

    async function uploadRetrainData() {
      const files = document.getElementById('retrainFiles').files;
      const label = document.getElementById('retrainLabel').value;
      const box = document.getElementById('retrainResult');
      box.className = 'result-box';

      if (!files.length) {
        box.textContent = 'Select one or more images.';
        return;
      }

      const form = new FormData();
      form.append('label', label);
      for (const f of files) {
        form.append('files', f);
      }
      box.textContent = 'Uploading images...';

      const res = await fetch('/upload-retrain-data', { method: 'POST', body: form });
      const data = await res.json();

      if (!res.ok) {
        box.className = 'result-box error';
        box.textContent = data.detail || 'Upload failed.';
        return;
      }

      box.innerHTML = `
        <strong>Upload complete</strong>
        <div class="kv-grid">
          <div class="kv-item"><span class="kv-label">Uploaded</span><strong>${data.uploaded_count} images</strong></div>
          <div class="kv-item"><span class="kv-label">Label</span><strong>${data.label}</strong></div>
          <div class="kv-item"><span class="kv-label">Pending for Retrain</span><strong>${data.pending_uploads}</strong></div>
        </div>
      `;
    }

    async function triggerRetrain() {
      const box = document.getElementById('retrainResult');
      box.className = 'result-box';
      box.textContent = 'Retraining model...';

      const res = await fetch('/retrain', { method: 'POST' });
      const data = await res.json();

      if (!res.ok) {
        box.className = 'result-box error';
        box.textContent = data.detail || 'Retraining failed.';
        return;
      }

      const m = data.test_metrics_after_retrain;
      box.innerHTML = `
        <strong>Retraining complete</strong>
        <div class="kv-grid">
          <div class="kv-item"><span class="kv-label">New Version</span><strong>${data.model_version}</strong></div>
          <div class="kv-item"><span class="kv-label">New Images Used</span><strong>${data.new_samples_processed}</strong></div>
          <div class="kv-item"><span class="kv-label">Epochs Run</span><strong>${data.epochs_ran}</strong></div>
          <div class="kv-item"><span class="kv-label">Test Accuracy</span><strong>${(m.accuracy * 100).toFixed(1)}%</strong></div>
          <div class="kv-item"><span class="kv-label">Test F1 Score</span><strong>${m.f1_score}</strong></div>
          <div class="kv-item"><span class="kv-label">Test Loss</span><strong>${m.loss}</strong></div>
        </div>
      `;
      loadVersion();
    }

    loadVersion();
    loadVisualizations();
  </script>
</body>
</html>
