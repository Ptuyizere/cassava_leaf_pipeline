services:
  ml-api:
    build: .
    expose:
      - "8000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    deploy:
      replicas: 2
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - ml-api
    restart: unless-stopped
